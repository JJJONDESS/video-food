<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR GLB with Smoke - Scan & Enjoy</title>

  <!-- A-Frame Core -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- A-Frame Particle System Component -->
  <script src="https://unpkg.com/aframe-particle-system-component@1.0.0/dist/aframe-particle-system-component.min.js"></script>

</head>
<body>
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.1; filterBeta: 10;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- The image target entity -->
    <a-entity mindar-image-target="targetIndex: 0" id="imageTarget">
      
      <!-- 1. The GLB Model (e.g., a burger or pizza) -->
      <!-- Replace 'your-model.glb' with your actual model file -->
      <a-entity 
        id="arModel"
        gltf-model="./VegPizza_small-v1.glb" 
        position="0 0 0" 
        scale="0.5 0.5 0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;"
        visible="false"
      ></a-entity>

      <!-- 2. The Smoke Particle System attached to the model -->
      <!-- This creates a continuous plume of smoke rising from the model -->
      <a-entity 
        id="smokeEmitter"
        particle-system="preset: smoke; color: #FFFFFF; size: 0.5; velocity: 0.5; opacity: 0.6;"
        position="0 0.5 0" 
        visible="false"
      ></a-entity>

    </a-entity>
  </a-scene>

  <script>
    const imageTarget = document.querySelector('#imageTarget');
    const arModel = document.querySelector('#arModel');
    const smokeEmitter = document.querySelector('#smokeEmitter');

    // When the image target is found, show the model and start the smoke
    imageTarget.addEventListener('targetFound', () => {
      console.log("Target found!");
      // Show the 3D model
      arModel.setAttribute('visible', 'true');
      // Show and start the smoke effect
      smokeEmitter.setAttribute('visible', 'true');
      // The particle system component handles the emission automatically once visible
    });

    // When the image target is lost, hide everything
    imageTarget.addEventListener('targetLost', () => {
      console.log("Target lost!");
      arModel.setAttribute('visible', 'false');
      smokeEmitter.setAttribute('visible', 'false');
    });
  </script>
</body>
</html>
